# Gitee Go PR 流水线：目标分支为 main 的 Pull Request 触发（合并前门禁）。
# 与 MasterPipeline 相同的检查，去掉依赖漏洞扫描（master 上每日可见即可）。
version: '1.0'
name: pr-pipeline
displayName: PR 合并前检查

triggers:
  pr:
    branches:
      precise:
        - main

stages:
  - stage: lint
    displayName: Lint（ruff）
    strategy: fast
    trigger: auto
    steps:
      - step: build@python
        name: ruff_lint
        displayName: Ruff 静态检查
        pythonVersion: '3.11'
        commands:
          # lint 只需 ruff 本身，不装整份 dev 依赖，十几秒完成。
          # pip 在该容器装到用户目录（不在 PATH），故用 python -m 调用。
          - pip install ruff==0.16.3 -i https://mirrors.aliyun.com/pypi/simple/
          - cd backend && python -m ruff check .

  - stage: backend-test
    displayName: 后端测试（SQLite 无网络子集）
    strategy: fast
    trigger: auto
    steps:
      - step: build@python
        name: pytest
        displayName: pytest + 覆盖率
        pythonVersion: '3.11'
        commands:
          - pip install -r backend/requirements.lock -r backend/requirements-dev.txt -i https://mirrors.aliyun.com/pypi/simple/
          - cd backend && python -m pytest -m "not live and not postgres" --cov=app --cov-report=term-missing --cov-fail-under=60

  - stage: frontend
    displayName: 前端测试与构建
    strategy: fast
    trigger: auto
    steps:
      - step: build@nodejs
        name: frontend_build
        displayName: vitest + vite build
        # vite 7 要求 Node ^20.19 || >=22.12；nodeVersion 必须是插件下拉列表中的
        # 完整版本号（写 "20" 不会初始化 Node 环境）
        nodeVersion: '20.19.0'
        commands:
          - set -e
          - cd frontend && npm ci --registry=https://registry.npmmirror.com
          - npm test
          - npm run build
