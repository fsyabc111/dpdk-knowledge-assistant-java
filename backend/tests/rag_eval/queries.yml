# RAG 检索评估题库（第一阶段：评估体系先行）
#
# 与 tests/test_retrieval.py 的关系：本题库是检索回归断言的唯一事实来源，
# test_retrieval.py 从这里 parametrize 生成用例（live mark）；runner.py 用
# 同一题库计算 recall@k / MRR 量化指标并与本地基线对比漂移。
#
# 字段说明：
#   id               用例唯一标识（--case 按它筛选）
#   category         分类（协议检测/子系统/主题召回/文件名定位/结构体与接口/
#                    概念与链路/Web 层/去重多样性/边界/负例观察）
#   question         发送给检索服务的原始问题
#   expected_sources 相关组列表：一组内片段互为替代（任一命中即该组召回），
#                    组间是 AND（全部组命中才算完全召回，coverage@k=1.0）
#   must_top         可选：要求 top-1 命中的片段（或替代片段列表）
#   expect_nonempty  可选：仅断言返回非空（模糊/乱码边界例）
#   observe          可选：true 时只记录不进通过判定（负例观察）
#   limit            可选：pytest 硬断言使用的 limit（默认 10，与迁移前一致）
#   note             可选：人工备注
#
# 判定哲学：检索指标是量化观测（recall/MRR 进基线对比），pytest 硬断言保持
# 迁移前的二值语义。新增题目时先在真实环境跑 runner 确认当前系统能召回，
# 再决定是否设 must_top；负例只观察不卡线（检索层没有「拒答」语义，答案层
# 的低置信由 test_answer_quality.py 负责）。

cases:
  # ------------------------------------------------------------------
  # 协议检测
