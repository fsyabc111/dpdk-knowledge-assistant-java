# 只用于获准的 Java 隔离演练；不复用旧项目的资源或入口。
name: dpdk-java-isolated
services:
  postgres-java:
    image: pgvector/pgvector:0.8.4-pg17@sha256:dd467f03ca5c5581222490e5217e48a262864ccb659be559f8491bbafdc97da0
    environment:
      POSTGRES_DB: dpdk_java_isolated
      POSTGRES_USER: dpdk_java_isolated
      POSTGRES_PASSWORD: ${DPDK_JAVA_DB_PASSWORD:?必须显式提供新隔离库口令}
      PGDATA: /var/lib/postgresql/data/java-isolated
    volumes:
      - java-pg-data:/var/lib/postgresql/data
      - ./deploy-java/postgres/10-identity.sh:/docker-entrypoint-initdb.d/10-identity.sh:ro
    networks: [java-data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U dpdk_java_isolated -d dpdk_java_isolated]
      interval: 3s
      timeout: 3s
      retries: 30
    shm_size: 128mb
    mem_limit: 1g
    cpus: 1.0
    restart: "no"
  backend-java:
    build:
      context: .
      dockerfile: deploy-java/Dockerfile.backend
    environment:
      SERVER_PORT: 18090
      DPDK_JAVA_DB_URL: jdbc:postgresql://postgres-java:5432/dpdk_java_isolated
      DPDK_JAVA_DB_USER: dpdk_java_isolated
      DPDK_JAVA_DB_NAME: dpdk_java_isolated
      DPDK_JAVA_DB_PASSWORD: ${DPDK_JAVA_DB_PASSWORD:?必须显式提供新隔离库口令}
      DPDK_JAVA_DB_COMMENT: dpdk-java-isolated-rehearsal
      DPDK_JAVA_DB_DATA_DIR: /var/lib/postgresql/data/java-isolated
      DPDK_JAVA_CORS_ORIGINS: https://localhost:${DPDK_JAVA_HTTPS_PORT:-18443}
      AUTH_MODE: ${DPDK_JAVA_AUTH_MODE:-account}
      # 该project默认只使用内网固定替身；不是live模型配置或质量声明。
      DPDK_MODEL_CHAT_BASE_URL: http://fake-upstream:18091/v1
      DPDK_MODEL_CHAT_API_KEY: isolated-fixed-key
      DPDK_MODEL_CHAT_MODEL_NAME: isolated-chat
      DPDK_MODEL_EMBEDDING_BASE_URL: http://fake-upstream:18091/v1
      DPDK_MODEL_EMBEDDING_API_KEY: isolated-fixed-key
      DPDK_MODEL_EMBEDDING_MODEL_NAME: isolated-embedding
      DPDK_JAVA_MODEL_JUDGE_ENABLED: "false"
      # 外部源根通过同一份显式只读挂载提供，绝不猜上级目录。
      JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=/tmp
      DPDK_JAVA_KNOWLEDGE_CONFIG: /sources/knowledge_sources.yml
      DPDK_JAVA_DPDK_ROOT: /sources/dpdk
      DPDK_JAVA_ASSISTANT_ROOT: /sources/assistant
      DPDK_JAVA_INDEX_WORKING_DIRECTORY: /sources
      DPDK_MIGRATION_RUN_ON_STARTUP: "true"
      DPDK_TASK_BACKGROUND_ENABLED: "true"
      # 本轮仅固定结果、绝不执行源码的MCP替身；不是旧/真实harness。
      DPDK_HARNESS_URL: http://fake-upstream:18091/mcp
    volumes:
      - ${DPDK_JAVA_SOURCE_SNAPSHOT_DIR:?必须显式给出外部源只读目录}:/sources:ro
    depends_on:
      postgres-java:
        condition: service_healthy
      fake-upstream:
        condition: service_healthy
    networks: [java-edge, java-data, java-harness]
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp:rw,noexec,nosuid,size=128m,uid=10001,gid=10001]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2.0
    stop_grace_period: 30s
    restart: "no"
  frontend-java:
    build:
      context: .
      dockerfile: deploy-java/Dockerfile.frontend
    ports: ["127.0.0.1:${DPDK_JAVA_HTTPS_PORT:-18443}:8443"]
    volumes:
      - ${DPDK_JAVA_CERT_DIR:?必须先生成独立演练证书}:/etc/nginx/certs:ro
    depends_on: [backend-java]
    networks: [java-edge]
    user: "${DPDK_JAVA_PROXY_UID:?必须提供非root证书所有者UID}:${DPDK_JAVA_PROXY_GID:?必须提供证书所有者GID}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
      - /var/cache/nginx:rw,noexec,nosuid,size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    restart: "no"
  # 默认仅启用不执行代码的固定替身；不能冒充真实模型/harness质量验收。
  fake-upstream:
    image: node:22-alpine
    command: [node, /app/server.mjs]
    volumes: [./deploy-java/fake-upstream/server.mjs:/app/server.mjs:ro]
    networks: [java-harness]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:18091/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
    user: "1000:1000"
    read_only: true
    tmpfs: [/tmp:rw,noexec,nosuid,size=32m,uid=1000,gid=1000]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    restart: "no"
  # 只接受另行审查并本地构建的镜像；默认不启动/不拉取，不授权真实评测。
  harness-java:
    profiles: [harness-authorized]
    image: ${DPDK_JAVA_HARNESS_IMAGE:-dpdk-java-isolated-harness:unconfigured}
    pull_policy: never
    environment:
      TH_MCP_TRANSPORT: http
      TH_MCP_HOST: 0.0.0.0
      TH_MCP_PORT: "18100"
      TH_HARNESS_HOME: /opt/teaching_harness
    networks: [java-harness]
    user: "10001:10001"
    read_only: true
    # harness编译的动态库需exec；临时输入仅驻留内存，不进入卷或备份。
    tmpfs: [/tmp:rw,exec,nosuid,size=256m,uid=10001,gid=10001]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    restart: "no"
networks:
  java-edge: {}
  java-data:
    internal: true
  java-harness:
    internal: true
volumes:
  java-pg-data: {}
