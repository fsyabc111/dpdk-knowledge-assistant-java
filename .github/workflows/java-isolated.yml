name: Java isolated verification
on:
  push:
    branches: ['codex/**']
    paths: ['backend-java/**', 'frontend/**', 'deploy-java/**', 'scripts-java/**', 'docker-compose.java.yml', '.github/workflows/java-isolated.yml']
  pull_request:
    paths: ['backend-java/**', 'frontend/**', 'deploy-java/**', 'scripts-java/**', 'docker-compose.java.yml', '.github/workflows/java-isolated.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: java-isolated-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend-java/pom.xml
      - name: Pure unit tests; no database or upstream configuration
        working-directory: backend-java
        run: ./mvnw -B test
      - name: Package CLI and verify help without database
        working-directory: backend-java
        run: ./mvnw -B -DskipTests package
      - run: scripts-java/operations.sh --help
  postgres:
    runs-on: ubuntu-latest
    services:
      java-ci-pg:
        image: pgvector/pgvector:0.8.4-pg17@sha256:dd467f03ca5c5581222490e5217e48a262864ccb659be559f8491bbafdc97da0
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: java_isolated_ci
          POSTGRES_PASSWORD: synthetic-ci-only
          PGDATA: /var/lib/postgresql/data/java-ci
        ports: ['127.0.0.1:15481:5432']
        options: >-
          --health-cmd "pg_isready -U java_isolated_ci -d postgres"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      DPDK_TEST_PG_URL: jdbc:postgresql://127.0.0.1:15481/postgres
      DPDK_TEST_PG_USER: java_isolated_ci
      DPDK_TEST_PG_PASSWORD: synthetic-ci-only
      DPDK_TEST_PG_DATA_DIR: /var/lib/postgresql/data/java-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend-java/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install original frontend client runtime for Java HTTP integration
        # 完整Java HTTP集成会执行原前端API客户端，需要真实Node/esbuild依赖。
        # 在独立前端job通过不能替代本job的运行依赖。
        working-directory: frontend
        run: npm ci
      - name: Explicit dedicated PG integration
        working-directory: backend-java
        run: ./mvnw -B test
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build
  deployment-materials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax and fake-upstream syntax
        run: |
          for script in scripts-java/*.sh deploy-java/postgres/*.sh; do bash -n "$script"; done
          node --check deploy-java/fake-upstream/server.mjs
      - name: Compose expansion only; no image start, no deployment
        env:
          DPDK_JAVA_DB_PASSWORD: synthetic-config-only
          DPDK_JAVA_SOURCE_SNAPSHOT_DIR: /tmp/java-ci-sources
          DPDK_JAVA_CERT_DIR: /tmp/java-ci-certs
          DPDK_JAVA_PROXY_UID: '1000'
          DPDK_JAVA_PROXY_GID: '1000'
        run: docker compose -f docker-compose.java.yml --profile rehearsal config --quiet
