spring:
  application:
    name: dpdk-assistant
  # 迁移只由 platform.migration.MigrationController 在数据库身份预检通过后执行，
  # 禁止 Boot 自动触发 Flyway / SQL 初始化（契约 schema-migration.md：预检必须先于自动迁移）。
  flyway:
    enabled: false
  sql:
    init:
      mode: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    io.dpdk: INFO

# 数据源与数据库身份没有默认值：缺失或身份不符直接 fail-closed（J1-01 验收项）。
# 只接受独立测试/受控目标；禁止回退 .env、宿主机默认库或旧部署。
dpdk:
  # React 联调来源（vite dev server）；逗号分隔，空=不放开任何来源。
  # SP-05（2026-10-25 验收修复）+R段审查建议：默认对齐冻结 Python 基线
  # FRONTEND_ORIGINS（config.py:116，含顺序），与 frontend/vite.config.js dev 端口一致；
  # FRONTEND_ORIGINS 为 P0 冻结环境键（同 GRADING_* 桥接口径）。
  # 优先级：DPDK_JAVA_CORS_ORIGINS > FRONTEND_ORIGINS > 源默认。
  cors-origins: ${DPDK_JAVA_CORS_ORIGINS:${FRONTEND_ORIGINS:http://127.0.0.1:5174,http://localhost:5174}}
  datasource:
    url: ${DPDK_JAVA_DB_URL:}
    username: ${DPDK_JAVA_DB_USER:}
    password: ${DPDK_JAVA_DB_PASSWORD:}
  database-identity:
    expected-database: ${DPDK_JAVA_DB_NAME:}
    expected-user: ${DPDK_JAVA_DB_USER:}
    expected-comment: ${DPDK_JAVA_DB_COMMENT:}
    expected-data-dir: ${DPDK_JAVA_DB_DATA_DIR:}
