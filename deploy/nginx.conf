# DPDK Knowledge Assistant — production reverse proxy.
# Baked into the frontend image at /etc/nginx/conf.d/default.conf.

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Self-signed rehearsal certs are generated by deploy/certs/gen_self_signed_cert.sh;
    # mount real certs at the same path for production.
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # API reverse proxy. The backend sets its own security headers; do not
    # duplicate them here. SSE requires buffering off + long read timeout.
    # The resolver + variable form forces per-request DNS re-resolution via
    # Docker's embedded DNS (127.0.0.11), so backend container recreation
    # (new IP) never leaves nginx pointing at a stale address.
    location /api/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $backend_upstream http://backend:8090;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Fingerprinted build assets: long immutable cache.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA static hosting with history-api fallback.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" always;
    }
}
